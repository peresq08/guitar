<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11161c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)">
<meta name="description" content="Entrenador personal de guitarra: rutina diaria, camino por niveles, afinador, jam y progreso.">
<title>Riff · Entrenador de guitarra</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo"><svg class="pick" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22c-1.2 0-6.5-8.6-7.6-13.2C3.6 5.4 7.3 2.5 12 2.5s8.4 2.9 7.6 6.3C18.5 13.4 13.2 22 12 22z"/></svg>Riff</span><span class="lvl" id="topLevel"></span></div>
  <div class="viewtools" id="viewTools" hidden>
    <button class="vt" id="tgSide" aria-pressed="false" title="Ocultar o mostrar el panel de la derecha"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg><span>Panel</span></button>
    <button class="vt" id="tgFocus" title="Pantalla completa: solo lo que necesitas mientras tocas (tecla F)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Pantalla completa</span></button>
  </div>
  <div class="streak" id="topStreak"></div>
</header>
<button class="focus-exit" id="focusExit" hidden title="Salir de pantalla completa (Esc o F)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>Salir</button>

<main id="app">
  <section id="v-hoy" class="view"></section>
  <section id="v-practicar" class="view" hidden></section>
  <section id="v-afinador" class="view" hidden></section>
  <section id="v-acordes" class="view" hidden></section>
  <section id="v-progreso" class="view" hidden></section>
</main>

<nav class="tabbar" aria-label="Secciones">
  <button data-view="hoy" aria-current="page"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>Hoy</button>
  <button data-view="practicar"><svg viewBox="0 0 24 24"><path d="M9 18V6l11-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>Practicar</button>
  <button data-view="afinador"><svg viewBox="0 0 24 24"><path d="M4 18a8 8 0 0 1 16 0"/><path d="M12 18l4-7"/></svg>Afinador</button>
  <button data-view="acordes"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="1"/><path d="M5 8h14M5 13h14M10 3v18M14 3v18"/></svg>Acordes</button>
  <button data-view="progreso"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progreso</button>
  <div class="kbd-hint" aria-hidden="true"><b>Atajos</b><span><kbd>Espacio</kbd> iniciar o pausar</span><span><kbd>1</kbd>–<kbd>5</kbd> cambiar de sección</span><span><kbd>F</kbd> pantalla completa</span></div>
  <button class="navtoggle" id="navToggle" aria-label="Contraer el menú" title="Contraer el menú"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg><span>Contraer</span></button>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
